[package]
name = "mintiq-tool"
version = "0.1.0"
edition = "2021"
description = "Mintiq agent tools for IronClaw (Reborn WASM extension)"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.41.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
