<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F3EF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before anything renders (no flash): saved choice, else system preference.
      (function () {
        var t = null;
        try { t = localStorage.getItem("mintiq-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#0F2A1A" : "#F5F3EF");
      })();
    </script>
    <meta name="description" content="Mintiq: NFTs with a treasury, a mission and an agent that hires, pays and invests under rules enforced on NEAR. Testnet demo." />
    <title>Mintiq — NFTs that hire, pay and earn (NEAR testnet)</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Mintiq: NFTs that hire, pay and earn (free on NEAR testnet)" />
    <meta property="og:description" content="Mint an NFT with a treasury and a mission. Its agent posts jobs, scores work and invests idle funds under rules the contract enforces. Free on testnet." />
    <meta property="og:image" content="https://mintiq-pink.vercel.app/og-image.png" />
    <meta property="og:url" content="https://mintiq-pink.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #F5F3EF; }
      html[data-theme="dark"] body, html[data-theme="dark"] #splash { background: #0F2A1A; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #F5F3EF; z-index: 999; transition: opacity .3s ease; }
      #splash .sp { position: relative; width: 160px; height: 83px; animation: sp-pulse 1.6s ease-in-out infinite; will-change: transform; }
      #splash img { width: 100%; height: 100%; display: block; animation: sp-glow 1.6s ease-in-out infinite; will-change: filter; }
      #splash .sp::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        -webkit-mask: url(/mintiq-logo.png) center / contain no-repeat; mask: url(/mintiq-logo.png) center / contain no-repeat;
        background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.85) 50%, transparent 70%) no-repeat;
        background-size: 250% 100%; animation: sp-shine 1.6s ease-in-out infinite; }
      #splash .ring { position: absolute; inset: -16px -22px; border-radius: 50%; border: 2px solid rgba(148,196,71,.55); animation: sp-ring 1.6s ease-out infinite; will-change: transform, opacity; }
      @keyframes sp-pulse { 0%, 100% { transform: scale(.92) translateY(2px); } 50% { transform: scale(1.06) translateY(-3px); } }
      @keyframes sp-glow { 0%, 100% { filter: drop-shadow(0 0 2px rgba(148,196,71,.25)); } 50% { filter: drop-shadow(0 0 22px rgba(148,196,71,.85)); } }
      @keyframes sp-shine { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
      @keyframes sp-ring { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp, #splash .sp::after, #splash .ring { animation: none; }
        #splash .ring { display: none; }
        #splash img { animation: sp-glow 3s ease-in-out infinite; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp"><span class="ring"></span><img src="/mintiq-logo.png" alt="" /></div>
    </div>
    <div id="root"></div>
    <noscript>Mintiq needs JavaScript to read NEAR testnet and connect your wallet.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
